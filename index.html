<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>理赔案件管理系统 · 单机本地版</title>
<style>
  :root{
    --primary:#1f4e79; --primary-dark:#163a5c; --primary-light:#e8f0f7;
    --me:#2f6f9f; --customer:#8a6d2f; --claims:#5b5b8c;
    --ok:#2e8b57; --warn:#e08a1e; --danger:#c0392b;
    --bg:#f4f6f8; --card:#fff; --line:#e3e8ee; --text:#26323d; --muted:#7a8794;
    --radius:12px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.55}
  button{font-family:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit;font-size:15px}
  .wrap{max-width:1080px;margin:0 auto;padding:16px}
  /* ===== 顶栏 ===== */
  header.top{background:var(--primary);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:20}
  .top-inner{max-width:1080px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .top h1{font-size:18px;font-weight:700}
  .top .sub{font-size:12px;opacity:.8;margin-top:2px}
  .top-actions{display:flex;gap:8px;flex-wrap:wrap}
  .btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 13px;font-size:14px;color:var(--text)}
  .btn:hover{border-color:var(--primary)}
  .btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
  .btn.primary:hover{background:var(--primary-dark)}
  .btn.danger{color:var(--danger);border-color:#f0c4bf}
  .btn.small{padding:5px 10px;font-size:13px}
  .btn.ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,0.4)}
  /* ===== 备份提醒条 ===== */
  .backup-bar{background:#fff6e9;border-bottom:1px solid #f3ddb8;color:#8a5a12;padding:10px 16px;font-size:14px;display:none}
  .backup-bar.show{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .backup-bar a{color:var(--primary);text-decoration:underline;cursor:pointer}
  /* ===== 统计卡片 ===== */
  .stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:16px 0}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:13px}
  .stat .num{font-size:24px;font-weight:700}
  .stat .lbl{font-size:12.5px;color:var(--muted);margin-top:2px}
  .stat.s-me .num{color:var(--me)} .stat.s-cust .num{color:var(--customer)}
  .stat.s-claim .num{color:var(--claims)} .stat.s-risk .num{color:var(--danger)}
  .stat.s-closed .num{color:var(--muted)}
  @media(max-width:760px){.stats{grid-template-columns:repeat(2,1fr)}}
  /* ===== 工具条 ===== */
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .toolbar input.search{flex:1;min-width:180px;padding:9px 12px;border:1px solid var(--line);border-radius:8px}
  .toolbar select{padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
  /* ===== 案件卡片列表 ===== */
  .case-list{display:flex;flex-direction:column;gap:12px}
  .case-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:15px;cursor:pointer;transition:.15s}
  .case-card:hover{border-color:var(--primary);box-shadow:0 2px 10px rgba(31,78,121,.08)}
  .case-card.risk{border-left:4px solid var(--danger)}
  .case-card.warn{border-left:4px solid var(--warn)}
  .case-card.ok{border-left:4px solid var(--ok)}
  .case-card.onme{border-left:4px solid var(--me)}
  .case-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
  .case-title{font-weight:700;font-size:16px}
  .case-no{font-size:12.5px;color:var(--muted);margin-left:6px}
  .case-meta{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:13.5px;color:#44525e}
  .case-meta b{font-weight:600}
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .tag{font-size:12px;padding:3px 9px;border-radius:20px;background:var(--primary-light);color:var(--primary)}
  .tag.me{background:#e6f0f6;color:var(--me)}
  .tag.customer{background:#f6f0e2;color:var(--customer)}
  .tag.claims{background:#ececf4;color:var(--claims)}
  .tag.closed{background:#eef1f3;color:var(--muted)}
  .tag.risk{background:#fbeae8;color:var(--danger)}
  .tag.warn{background:#fdf2e3;color:var(--warn)}
  .tag.ok{background:#e8f4ec;color:var(--ok)}
  .case-foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:13px}
  .countdown{font-weight:700}
  .countdown.danger{color:var(--danger)} .countdown.warn{color:var(--warn)} .countdown.ok{color:var(--ok)}
  /* ===== 详情页 ===== */
  .detail-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}
  .panel h3{font-size:15px;margin-bottom:12px;color:var(--primary-dark)}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  .grid .full{grid-column:1/-1}
  @media(max-width:640px){.grid{grid-template-columns:1fr}}
  .field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px}
  .field input,.field select,.field textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:#fff}
  .field textarea{resize:vertical;min-height:64px}
  .kv{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 16px;font-size:14px}
  .kv .full{grid-column:1/-1}
  .kv div span{color:var(--muted);font-size:12.5px;display:block}
  @media(max-width:640px){.kv{grid-template-columns:1fr}}
  /* ===== 节点流转条 ===== */
  .flow{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .flow .node{font-size:13px;padding:6px 12px;border-radius:8px;background:#eef1f4;color:var(--muted)}
  .flow .node.active{background:var(--primary);color:#fff}
  /* ===== 日志时间线 ===== */
  .timeline{display:flex;flex-direction:column;gap:0}
  .log{display:flex;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line)}
  .log:last-child{border-bottom:none}
  .log-dot{width:10px;height:10px;border-radius:50%;margin-top:7px;flex:none}
  .log-dot.me{background:var(--me)} .log-dot.customer{background:var(--customer)} .log-dot.claims{background:var(--claims)} .log-dot.system{background:var(--muted)}
  .log-body{flex:1}
  .log-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px}
  .log-method{font-weight:600}
  .log-time{color:var(--muted);font-size:12.5px}
  .log-content{margin-top:4px;font-size:14px;white-space:pre-wrap}
  /* ===== 弹窗 ===== */
  .mask{position:fixed;inset:0;background:rgba(20,30,40,.45);z-index:30;display:none;align-items:flex-start;justify-content:center;padding:24px 14px;overflow:auto}
  .mask.show{display:flex}
  .modal{background:#fff;border-radius:14px;max-width:640px;width:100%;padding:20px}
  .modal h3{margin-bottom:14px}
  .modal .actions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}
  .empty{text-align:center;color:var(--muted);padding:40px 10px}
  .empty .big{font-size:32px;margin-bottom:8px}
  /* ===== 提醒框 ===== */
  .alert{border-radius:10px;padding:12px 14px;font-size:14px;margin-bottom:12px}
  .alert.danger{background:#fbeae8;color:var(--danger);border:1px solid #f0c4bf}
  .alert.warn{background:#fdf2e3;color:#9a6310;border:1px solid #f3ddb8}
  .alert.info{background:var(--primary-light);color:var(--primary-dark);border:1px solid #cfdde9}
  .toolbar-msg{font-size:13px;color:var(--muted)}
  /* ===== 通讯录 ===== */
  .contact-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  @media(max-width:640px){.contact-grid{grid-template-columns:1fr}}
  .contact-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:15px}
  .contact-card .c-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
  .contact-card .c-name{font-weight:700;font-size:16px}
  .contact-card .c-company{font-size:12.5px;color:var(--muted);margin-top:2px}
  .contact-card .c-body{margin-top:10px;display:flex;flex-direction:column;gap:5px;font-size:13.5px}
  .contact-card .c-body div{display:flex;gap:8px}
  .contact-card .c-body .k{color:var(--muted);min-width:52px;flex:none}
  .contact-card .c-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .contact-section{margin-bottom:22px}
  .contact-section h3{font-size:15px;color:var(--primary-dark);margin-bottom:10px}
  .backup-list{font-size:13px;color:var(--muted);margin-top:8px}
  .backup-list li{margin:6px 0;list-style:none}
  .backup-list .row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
  footer{text-align:center;color:var(--muted);font-size:12px;padding:24px 0}
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div>
      <h1>理赔案件管理系统 <span style="font-size:12px;font-weight:400;opacity:.8">单机本地版</span></h1>
      <div class="sub">节点按「我 / 客户 / 理赔」三方归属跟踪，对方 5 天未反馈自动提醒跟进</div>
    </div>
    <div class="top-actions">
      <button class="btn ghost" onclick="navTo('contacts')">通讯录</button>
      <button class="btn ghost" onclick="navTo('settings')">备份 / 设置</button>
      <button class="btn" onclick="openCaseForm()">＋ 新建案件</button>
    </div>
  </div>
</header>
<div class="backup-bar" id="backupBar">
  <span>⚠️ 今日还没有备份过案件数据，建议导出一份 JSON 备份，防止浏览器清理导致数据丢失。</span>
  <a onclick="navTo('settings')">去备份 →</a>
</div>
<div class="wrap" id="view"></div>

<!-- ===== 新建/编辑案件弹窗 ===== -->
<div class="mask" id="caseMask">
  <div class="modal">
    <h3 id="caseFormTitle">新建案件</h3>
    <div class="grid">
      <div class="field"><label>案件编号</label><input id="f_no" placeholder="如 CLM-2026-001"></div>
      <div class="field"><label>被保险人 / 客户</label><input id="f_exporter" placeholder="出口企业名称"></div>
      <div class="field"><label>海外买方</label><input id="f_buyer" placeholder="买方名称 / 国家"></div>
      <div class="field"><label>保单号</label><input id="f_policyNo"></div>
      <div class="field"><label>报损金额（美元）</label><input id="f_lossAmount" type="number" step="0.01" min="0"></div>
      <div class="field"><label>索赔金额（美元）</label><input id="f_claimAmount" type="number" step="0.01" min="0"></div>
      <div class="field"><label>理赔对接人</label><select id="f_relClaimContact"></select></div>
      <div class="field"><label>客户对接人</label><select id="f_relCustContact"></select></div>
      <div class="field"><label>当前阶段</label>
        <select id="f_stage">
          <option value="登记立案">登记立案</option>
          <option value="材料收集">材料收集</option>
          <option value="补件沟通">补件沟通</option>
          <option value="理赔审核">理赔审核</option>
          <option value="定损核赔">定损核赔</option>
          <option value="已结案">已结案</option>
        </select>
      </div>
      <div class="field"><label>当前节点归属方</label>
        <select id="f_owner">
          <option value="me">在我手里（客户经理）</option>
          <option value="customer">在客户手里</option>
          <option value="claims">在理赔手里</option>
        </select>
      </div>
      <div class="field"><label>出险原因 / 简述</label><input id="f_reason" placeholder="如拖欠货款、破产、拒收等"></div>
      <div class="field full"><label>备注</label><textarea id="f_note"></textarea></div>
    </div>
    <div class="actions">
      <button class="btn" onclick="closeMask('caseMask')">取消</button>
      <button class="btn primary" onclick="saveCase()">保存案件</button>
    </div>
  </div>
</div>

<!-- ===== 记录跟进日志弹窗 ===== -->
<div class="mask" id="logMask">
  <div class="modal">
    <h3>记录跟进日志</h3>
    <div class="field" style="margin-bottom:12px">
      <label>沟通方式</label>
      <select id="l_method">
        <option value="电话">电话</option>
        <option value="邮件">邮件</option>
        <option value="面谈">面谈</option>
        <option value="微信/即时通讯">微信 / 即时通讯</option>
        <option value="补件提交">补件提交</option>
        <option value="内部沟通">内部沟通（理赔/领导）</option>
      </select>
    </div>
    <div class="field" style="margin-bottom:12px">
      <label>标准记录模板（可选，自动带入，可再编辑）</label>
      <select id="l_template" onchange="applyTemplate()">
        <option value="">— 不使用模板 —</option>
      </select>
    </div>
    <div class="field">
      <label>沟通记录内容</label>
      <textarea id="l_content" rows="5" placeholder="记录本次沟通要点、对方反馈、下一步安排…"></textarea>
    </div>
    <div class="actions">
      <button class="btn" onclick="closeMask('logMask')">取消</button>
      <button class="btn primary" onclick="saveLog()">保存日志</button>
    </div>
  </div>
</div>

<!-- ===== 推进节点弹窗 ===== -->
<div class="mask" id="flowMask">
  <div class="modal">
    <h3>推进节点 / 流转归属</h3>
    <div class="alert info">收到对方反馈后，在此把案件交给下一方；若仍在等待对方回复，请用「记录跟进」并选择继续等待。</div>
    <div class="field" style="margin-bottom:12px"><label>流转到哪一方</label>
      <select id="w_to">
        <option value="me">回到我手里（客户经理）</option>
        <option value="customer">交给客户</option>
        <option value="claims">交给理赔</option>
      </select>
    </div>
    <div class="field" style="margin-bottom:12px"><label>更新阶段</label>
      <select id="w_stage">
        <option value="登记立案">登记立案</option>
        <option value="材料收集">材料收集</option>
        <option value="补件沟通">补件沟通</option>
        <option value="理赔审核">理赔审核</option>
        <option value="定损核赔">定损核赔</option>
        <option value="已结案">已结案</option>
      </select>
    </div>
    <div class="field"><label>本次发出 / 交接事项（给下一方做什么）</label><textarea id="w_action" rows="3" placeholder="如：向客户催要缺失的报关单；请理赔岗核定损失金额…"></textarea></div>
    <div class="actions">
      <button class="btn" onclick="closeMask('flowMask')">取消</button>
      <button class="btn primary" onclick="saveFlow()">确认流转</button>
    </div>
  </div>
</div>

<!-- ===== 通讯录弹窗 ===== -->
<div class="mask" id="contactMask">
  <div class="modal">
    <h3 id="contactFormTitle">新增联系人</h3>
    <div class="grid">
      <div class="field"><label>联系人类型</label>
        <select id="k_type" onchange="toggleContactType()">
          <option value="customer">客户对接人</option>
          <option value="claims">理赔人员</option>
        </select>
      </div>
      <div class="field"><label>姓名</label><input id="k_name" placeholder="姓名"></div>
      <div class="field" id="k_companyWrap"><label>所属企业 / 客户</label><input id="k_company" placeholder="对接的出口企业名称"></div>
      <div class="field" id="k_phoneWrap"><label>手机号码</label><input id="k_phone" placeholder="手机 / 联系电话"></div>
      <div class="field" id="k_extWrap" style="display:none"><label>内部分机号</label><input id="k_ext" placeholder="如 9622"></div>
      <div class="field"><label>邮箱</label><input id="k_email" placeholder="邮箱地址"></div>
      <div class="field full" id="k_addrWrap"><label>地址</label><input id="k_address" placeholder="办公地址 / 通讯地址"></div>
      <div class="field full"><label>备注</label><textarea id="k_note" rows="2"></textarea></div>
    </div>
    <div class="actions">
      <button class="btn" onclick="closeMask('contactMask')">取消</button>
      <button class="btn primary" onclick="saveContact()">保存联系人</button>
    </div>
  </div>
</div>

<script>
/* ============================================================
 * 数据层：localStorage 单机存储
 * ============================================================ */
const STORE_KEY = 'claimCases_v1';
const CONTACTS_KEY = 'claimContacts_v1';
const BACKUP_KEY = 'claimBackupHistory_v1';
const META_KEY = 'claimMeta_v1';
const FOLLOW_DAYS = 5;
const WARN_DAYS = 2;

const PRESET_CLAIMS = [
  {name:'张艳兰', ext:'9622', email:'zhangyl@'},
  {name:'陆丽欣', ext:'8156', email:'lulx_gd@'},
  {name:'黄娜',   ext:'8064', email:'huangn@'},
  {name:'谢智筠', ext:'8147', email:'xiezj@'},
  {name:'柳雅琪', ext:'8172', email:'liuyaqi@'},
  {name:'梁燕铃', ext:'9708', email:'liangyl_gd@'},
  {name:'朱文婷', ext:'9635', email:'zhuwt_gd@'}
];

const TEMPLATES = [
  {id:'t_cust_collect', title:'客户 · 电话催办补件', method:'电话',
   text:'致电客户【被保险人】，沟通当前索赔材料准备进度；告知尚未提交的材料清单，提醒尽快补齐，并确认预计提交时间。对方反馈：【记录反馈】。下一步：继续跟进材料回收情况。'},
  {id:'t_cust_mail', title:'客户 · 邮件催办/材料清单', method:'邮件',
   text:'向客户发送邮件，列明需补充的索赔材料及提交时限，同步说明当前理赔流程进度；请客户收到后回复确认材料准备情况。'},
  {id:'t_claims_follow', title:'理赔 · 内部跟进定损审核', method:'内部沟通',
   text:'向理赔岗核实本案件定损 / 审核进度，确认目前卡在哪个环节、有无补充意见，以及预计反馈时间。反馈要点：【记录】。下一步：按理赔意见推进。'},
  {id:'t_cust_comm', title:'客户 · 案情沟通记录', method:'面谈',
   text:'与客户当面 / 电话沟通案件进展，记录客户对出险经过、金额、责任认定的说明及主要诉求；确认双方下一步配合事项。'},
  {id:'t_feedback', title:'对方已反馈 · 记录回执', method:'邮件',
   text:'收到【客户/理赔】反馈，反馈内容：【记录要点】。据此推进下一节点。'}
];

/* 先声明再初始化，避免在初始化器里引用尚未完成的 let 绑定（TDZ）
   原来写 let cases = load() 时，load → seed → save → snapshot 会读取 cases 本身，
   抛 ReferenceError 导致整个脚本中断、页面空白、按钮全部失效。 */
let cases = [];
let contacts = [];
let meta = {};
(function initData(){
  try{ cases = load(); }catch(e){ console.error(e); cases = []; }
  try{ contacts = loadContacts(); }catch(e){ console.error(e); contacts = []; }
  try{ meta = loadMeta(); }catch(e){ console.error(e); meta = {}; }
  save(); saveContacts();
})();

let editingId = null;
let followCaseId = null;
let editingContactId = null;
let currentView = "home";
let showCaseDetailId = null;

// 页面跳转（无hash，内存变量）
function navTo(viewName){
    currentView = viewName;
    showCaseDetailId = null;
    render();
    window.scrollTo(0,0);
}

// 填充案件编辑弹窗的对接人下拉
function fillCaseContactSelect(){
  const claimSel = document.getElementById('f_relClaimContact');
  const custSel = document.getElementById('f_relCustContact');
  claimSel.innerHTML = `<option value="">—未选择理赔对接人—</option>`;
  custSel.innerHTML = `<option value="">—未选择客户对接人—</option>`;
  contacts.forEach(c=>{
    if(c.type === 'claims'){
      claimSel.innerHTML += `<option value="${c.id}">${esc(c.name)}｜分机:${esc(c.ext||'')}｜${esc(c.email||'')}</option>`;
    }else{

function toDateStr(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function daysAgo(n){ const d=new Date(); d.setDate(d.getDate()-n); return toDateStr(d); }
function diffDays(dateStr){ if(!dateStr) return null; const a=new Date(dateStr+'T00:00:00'); const b=new Date(todayStr()+'T00:00:00'); return Math.round((b-a)/86400000); }

const OWNER_LABEL = {me:'我（客户经理）', customer:'客户', claims:'理赔'};
const OWNER_COLOR = {me:'me', customer:'customer', claims:'claims'};
function caseState(c){
  if(c.status==='closed') return {key:'closed', label:'已结案', cls:'closed'};
  if(c.owner==='me') return {key:'me', label:'在我手里', cls:'onme'};
  const days = diffDays(c.sentDate);
  if(days===null) return {key:'wait', label:'等待反馈', cls:'ok'};
  if(days > FOLLOW_DAYS) return {key:'risk', label:'逾期未反馈', cls:'risk', days};
  if(days >= FOLLOW_DAYS - WARN_DAYS) return {key:'warn', label:'临近到期', cls:'warn', days};
  return {key:'ok', label:'等待反馈', cls:'ok', days};
}

function renderList(){
  const kw = (document.getElementById('searchBox')?.value||'').trim().toLowerCase();
  let list = cases.slice();
  if(filter==='closed') list = list.filter(c=>c.status==='closed');
  else list = list.filter(c=>c.status!=='closed');
  if(filter==='me'||filter==='customer'||filter==='claims') list = list.filter(c=>c.owner===filter);
  if(filter==='risk') list = list.filter(c=>caseState(c).key==='risk');
  if(kw) list = list.filter(c=>[c.no,c.exporter,c.buyer,c.policyNo,c.reason].join(' ').toLowerCase().includes(kw));
  const rank = {risk:0, warn:1, me:2, ok:3, wait:4, closed:5};
  list.sort((a,b)=>rank[caseState(a).key]-rank[caseState(b).key] || (b.updatedAt-a.updatedAt));

  if(!list.length){ box.innerHTML = `<div class="empty"><div class="big">📂</div>暂无符合条件的案件</div>`; return; }
  box.innerHTML = `<div class="case-list">` + list.map(cardHtml).join('') + `</div>`;

function cardHtml(c){
  const st = caseState(c);

function saveCase(){
  const exporter = f_exporter.value.trim();
  if(!exporter){ alert('请填写被保险人 / 客户名称'); return; }
  const owner = f_owner.value;
  const payload = {
    no:f_no.value.trim()||('CLM-'+todayStr()),
    exporter,

    policyNo:f_policyNo.value.trim(),
    lossAmount:parseFloat(f_lossAmount.value)||0,
    claimAmount:parseFloat(f_claimAmount.value)||0,

    stage:f_stage.value,
    owner,
    reason:f_reason.value.trim(),
    note:f_note.value.trim()
  };
  if(editingId){
    const c = cases.find(x=>x.id===editingId);
    Object.assign(c, payload); c.updatedAt = Date.now();
    if(owner!=='me'){ c.waitingFor = owner; c.sentDate = c.sentDate||todayStr(); }
    else { c.waitingFor = null; }
  } else {
    const now = Date.now();
    cases.unshift(Object.assign({
      id:uid(), waitingFor: owner!=='me'?owner:null, sentDate: owner!=='me'?todayStr():null,
      sentAction:'', status:'open', createdAt:now, updatedAt:now, logs:[{
        id:uid(), time:now, method:'内部沟通', direction:'me',
        content:'案件登记入系统。', template:''
      }]
    }, payload));
  }
  save(); closeMask('caseMask');
  if(editingId){
      showCaseDetailId = editingId;
  }else{
      showCaseDetailId=null;
      currentView="home";
  }
  render();
}
function openFlow(id){
  const c = cases.find(x=>x.id===id); followCaseId = id;
  w_to.value = c.owner; w_stage.value = c.stage; w_action.value = c.sentAction||'';
  showMask('flowMask');
}
function saveFlow(){
  const c = cases.find(x=>x.id===followCaseId); if(!c) return;
  const to = w_to.value;
  c.owner = to; c.stage = w_stage.value; c.sentAction = w_action.value.trim();
  if(to==='me'){ c.waitingFor = null; c.sentDate = null; }
  else { c.waitingFor = to; c.sentDate = todayStr(); }
  c.logs.push({id:uid(), time:Date.now(), method:'内部沟通', direction:'me',
    content:`节点流转：交接给${OWNER_LABEL[to]}。事项：${c.sentAction||'（未填写）'}`, template:''});
  c.updatedAt = Date.now(); save(); closeMask('flowMask'); renderDetail(c.id);
}
function openLog(id){
  followCaseId = id;
  const sel = document.getElementById('l_template');
  sel.innerHTML = '<option value="">— 不使用模板 —</option>' +
    TEMPLATES.map(t=>`<option value="${t.id}">${t.title}</option>`).join('');
  l_method.value = '电话'; l_content.value = '';
  showMask('logMask');
}
function applyTemplate(){
  const t = TEMPLATES.find(x=>x.id===document.getElementById('l_template').value);
  if(t){ l_method.value = t.method; l_content.value = t.text; }
}
function saveLog(){
  const content = l_content.value.trim();
  if(!content){ alert('请填写沟通记录内容'); return; }
  const c = cases.find(x=>x.id===followCaseId); if(!c) return;
  c.logs.push({id:uid(), time:Date.now(), method:l_method.value, direction:c.owner, content,
    template:document.getElementById('l_template').value});
  c.updatedAt = Date.now();
  if(c.owner!=='me'){ c.sentDate = todayStr(); }
  save(); closeMask('logMask'); renderDetail(c.id);
}
function closeCase(id){
  const c = cases.find(x=>x.id===id); if(!c) return;
  if(c.status==='closed'){
    c.status='open';
    c.logs.push({id:uid(),time:Date.now(),method:'内部沟通',direction:'me',content:'案件重新打开继续跟进。',template:''});
  } else {
    if(!confirm('确认将该案件结案？结案后不再计入待办与逾期提醒。')) return;
    c.status='closed'; c.waitingFor=null;
    c.logs.push({id:uid(),time:Date.now(),method:'内部沟通',direction:'me',content:'案件结案归档。',template:''});
  }
  c.updatedAt=Date.now(); save();
  showCaseDetailId=null;
  currentView="home";
  render();
}

  const open = cases.some(c=>c.status!=='closed');
  const last = meta.lastBackupDate;
  const bar = document.getElementById('backupBar');
  bar.classList.toggle('show', open && last !== todayStr());
}
function renderSettings(){
  const hist = JSON.parse(localStorage.getItem(BACKUP_KEY))||[];
  const view = document.getElementById('view');
  view.innerHTML = `
    <div class="detail-head">

    <div class="panel">

      <div class="alert info">所有案件数据仅保存在当前浏览器中。请每天工作结束前导出一份 JSON 备份文件；清理浏览器缓存或换电脑前，务必先备份。</div>

          ${hist.length? hist.map((h,i)=>`<li class="row"><span>${new Date(h.time).toLocaleString('zh-CN')}（${h.cases.length} 件案件 · ${(h.contacts||[]).length} 位联系人）</span>
            <button class="btn small" onclick="rollback(${i})">回滚到此快照</button></li>`).join('') : '<li>暂无快照</li>'}
        </ul>
      </div>

      </div>

      <div class="alert danger">清空后数据不可恢复，请先导出 JSON 备份。</div>
      <button class="btn danger" onclick="clearAll()">清空全部案件数据</button>
    </div>`;
}
function exportJSON(){
  const payload = {app:'claim-case-system', version:1, exportAt:new Date().toISOString(), cases, contacts};
  const blob = new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  downloadBlob(blob, `理赔案件备份_${todayStr()}.json`);
  meta.lastBackupDate = todayStr(); saveMeta(); checkBackupBar();
  alert('备份文件已导出（含案件与通讯录），建议保存到固定文件夹或网盘。');
}
function importJSON(ev){
  const file = ev.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const data = JSON.parse(e.target.result);
      const arr = Array.isArray(data)?data:data.cases;
      if(!Array.isArray(arr)) throw new Error('格式不正确');
      if(!confirm(`将导入 ${arr.length} 件案件及通讯录，是否覆盖当前本机数据？（建议先导出当前备份）`)) return;
      cases = arr;
      if(Array.isArray(data.contacts)) contacts = data.contacts;
      save(); saveContacts(); meta.lastBackupDate = todayStr(); saveMeta();
      showCaseDetailId=null;currentView="home";
      render(); alert('导入成功。');
    }catch(err){ alert('导入失败：文件格式不正确。'); }
  };
  reader.readAsText(file);
  ev.target.value='';
}
function exportCSV(){
  const head = [
    '案件编号','被保险人/客户','海外买方','保单号','报损金额','索赔金额','出险原因',
    '归属方','阶段','状态','发出日期','交接事项','理赔对接人','理赔对接人联系方式','客户对接人','客户对接人联系方式','最近更新'
  ];
  const rows = cases.map(c=>{
    const claimContact = contacts.find(x=>x.id === c.relClaimContactId);
    const custContact = contacts.find(x=>x.id === c.relCustContactId);
    const claimName = claimContact ? claimContact.name : '';
    const claimInfo = claimContact ? `分机${claimContact.ext} ${claimContact.email}` : '';
    const custName = custContact ? custContact.name : '';
    const custInfo = custContact ? `手机${custContact.phone} ${custContact.email} ${custContact.address}` : '';

    return [
      c.no,c.exporter,c.buyer,c.policyNo,c.lossAmount,c.claimAmount,c.reason,
      OWNER_LABEL[c.owner],c.stage,
      c.status==='closed'?'已结案':'在办',
      c.sentDate||'',c.sentAction||'',
      claimName,claimInfo,custName,custInfo,
      new Date(c.updatedAt).toLocaleString('zh-CN')
    ];
  });
  const csv = '\uFEFF' + [head,...rows].map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\r\n');
  const blob = new Blob([csv],{type:'text/csv;charset=utf-8'});
  downloadBlob(blob, `理赔台账_${todayStr()}.csv`);
}
function rollback(i){
  const hist = JSON.parse(localStorage.getItem(BACKUP_KEY))||[];
  const h = hist[i]; if(!h) return;
  if(!confirm(`确认回滚到 ${new Date(h.time).toLocaleString('zh-CN')} 的快照？当前数据将被覆盖。`)) return;
  cases = JSON.parse(JSON.stringify(h.cases));
  if(Array.isArray(h.contacts)) contacts = JSON.parse(JSON.stringify(h.contacts));
  save(); saveContacts();
  showCaseDetailId=null;currentView="home";
  render(); alert('已回滚到该快照。');
}
function clearAll(){
  if(!confirm('确认清空全部案件、通讯录、日志与快照？此操作不可恢复！')) return;
  if(!confirm('再次确认：真的要全部删除吗？')) return;
  cases=[]; contacts=[]; localStorage.removeItem(BACKUP_KEY); save(); saveContacts();
  showCaseDetailId=null;currentView="home";
  render();
}
function downloadBlob(blob, name){
  const url = URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=url; a.download=name; document.body.appendChild(a);
  a.click();
  setTimeout(()=>{URL.revokeObjectURL(url); a.remove();},100);
}

function showMask(id){ document.getElementById(id).classList.add('show'); }
function closeMask(id){ document.getElementById(id).classList.remove('show'); }
document.querySelectorAll('.mask').forEach(m=>m.addEventListener('click',e=>{ if(e.target===m) m.classList.remove('show'); }));
function esc(s){ return String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])); }
